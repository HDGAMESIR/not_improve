name: telegram-bot

on:
  workflow_dispatch:          # دکمهی دستی در تب Actions
  schedule:
    - cron: "*/5 * * * *"    # هر ۵ دقیقه — اگه تست معمولیه نذار حتی

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 6        # همون ۶ دقیقهای که گفتی — سقفش ۳۶۰ هست
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py     # توکن توی خود فایلِ، پس بدون env اضافه اجرا میشه
